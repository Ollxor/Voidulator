name: smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pure text analysis, no browser — runs first so a string/registry
      # regression fails in seconds instead of after the Playwright install.
      - name: i18n + panel registry audit
        run: node tests/i18n-audit.mjs
      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: Run smoke test
        run: node tests/smoke.mjs
